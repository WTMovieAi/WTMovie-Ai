<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WTMovie AI" />
  <title>WTMovie AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      background: rgba(88, 166, 255, 0.15);
      color: #58a6ff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    p {
      color: #8b949e;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .btn:active {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">WTMovie AI • ចក្រវាលសម្រាយរឿង</div>
    <h1>WTMovie AI</h1>
    <p>វែបសាយសម្រាប់គ្រប់គ្រង និងរៀបចំការបកប្រែសម្រាយរឿង AI របស់អ្នកលើទូរស័ព្ទ។</p>
    <button class="btn" onclick="alert('WTMovie AI កំពុងដំណើរការល្អ!')">ចាប់ផ្តើមប្រើប្រាស់</button>
  </div>
</body>
</html>
