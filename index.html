<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="WTMovie AI" />
  <title>WTMovie AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(88, 166, 255, 0.15);
      color: #58a6ff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .btn {
      width: 100%;
      background: #238636;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .btn:active {
      opacity: 0.88;
    }
    #workspace {
      display: none;
      margin-top: 18px;
      text-align: left;
      border-top: 1px solid #30363d;
      padding-top: 16px;
    }
    textarea {
      width: 100%;
      min-height: 150px;
      background: #0d1117;
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1;
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-copy {
      flex: 1;
      background: #1f6feb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">WTMovie AI • ចក្រវាលសម្រាយរឿង</div>
    <h1>WTMovie AI</h1>
    <p>វែបសាយសម្រាប់គ្រប់គ្រង និងរៀបចំការបកប្រែសម្រាយរឿង AI របស់អ្នកលើទូរស័ព្ទ។</p>
    <button class="btn" onclick="openWorkspace()">ចាប់ផ្តើមប្រើប្រាស់</button>

    <div id="workspace">
      <textarea id="scriptBox" placeholder="វាយ ឬ Paste អត្ថបទសម្រាយរឿង / សាប់ នៅទីនេះ..."></textarea>
      <div class="actions">
        <button class="btn-copy" onclick="copyText()">ចម្លងអត្ថបទ</button>
        <button class="btn-secondary" onclick="clearText()">សម្អាត</button>
      </div>
    </div>
  </div>

  <script>
    function openWorkspace() {
      document.getElementById('workspace').style.display = 'block';
    }
    function copyText() {
      const box = document.getElementById('scriptBox');
      box.select();
      navigator.clipboard.writeText(box.value);
    }
    function clearText() {
      document.getElementById('scriptBox').value = '';
    }
  </script>
</body>
</html>
